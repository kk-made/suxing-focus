<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <!-- V5.2 暖调深灰版星座底图：单一尘埃色 #8C8C86、整体约 8% 微光；
       只做「若有若无的质地」，不抢内容的风头；由 body / 专注页以 cover 铺满 -->
  <defs>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 星座连线（虚线，手绘感；约 8% 微光） -->
  <g stroke="#8C8C86" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round" opacity="0.08">
    <!-- 北斗七星（左上） -->
    <path d="M150 108 L208 86 L243 128 L192 161 Z M192 161 L140 196 L94 228 L52 252"/>
    <!-- 仙后座（右中上） -->
    <path d="M758 318 L800 274 L838 326 L878 282 L918 332"/>
    <!-- 猎户座（左下） -->
    <path d="M260 640 L218 700 L242 748 L214 818 M260 640 L302 688 L294 756 L308 830 M242 748 L268 752 L294 756"/>
  </g>

  <!-- 星座主星（最亮的星也不过 12% 微光） -->
