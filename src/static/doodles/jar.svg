<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crayon-texture-jar">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#crayon-texture-jar)" stroke="var(--doodle-stroke, #3A3A3A)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 装满小星星的玻璃罐：成就收藏集·书下收藏插画专用 -->
    <!-- 罐身：一点点歪，右下角留着一笔没画满的缺口 -->
    <path d="M 76 60 C 69 67, 63 76, 59 86 C 53 100, 52 121, 52 143 C 52 158, 55 170, 62 174 C 82 178, 118 178, 139 174 C 147 170, 149 157, 149 143 C 149 116, 146 93, 139 81 C 134 72, 130 66, 127 60 C 114 57, 89 57, 76 60 Z" fill="var(--doodle-blue, #A9CCE3)" fill-opacity="0.6" stroke="none" />

    <!-- 三颗大小不一的马卡龙星星，收集进罐子里 -->
    <path class="jar-star" d="M 91 96 C 94 103, 96 110, 97 115 C 104 116, 111 118, 116 121 C 110 125, 104 128, 99 132 C 100 139, 99 145, 98 151 C 93 146, 88 142, 83 139 C 76 142, 70 145, 66 149 C 68 143, 70 137, 72 131 C 67 127, 62 123, 59 119 C 66 118, 72 117, 78 117 C 82 110, 87 103, 91 96 Z" fill="var(--doodle-pink, #F5B7B1)" fill-opacity="0.72" />
    <path class="jar-star" d="M 123 83 C 125 89, 127 94, 128 98 C 133 99, 138 100, 141 103 C 137 105, 132 107, 129 110 C 130 114, 129 118, 128 121 C 125 118, 122 115, 119 113 C 115 115, 111 117, 108 119 C 110 115, 111 111, 112 108 C 109 105, 106 102, 104 99 C 108 98, 112 97, 116 97 C 119 93, 121 88, 123 83 Z" fill="var(--doodle-yellow, #F9E79F)" fill-opacity="0.75" />
    <path class="jar-star" d="M 71 137 C 72 141, 73 145, 74 147 C 77 148, 80 149, 82 151 C 80 152, 77 154, 75 156 C 76 158, 75 160, 74 163 C 72 161, 70 159, 68 158 C 65 159, 63 161, 60 162 C 61 159, 62 156, 63 154 C 61 152, 59 150, 58 148 C 61 147, 64 147, 67 147 C 68 143, 69 140, 71 137 Z" fill="var(--doodle-green, #A2D9CE)" fill-opacity="0.7" />

    <!-- 罐身轮廓：右肩故意断掉一截，像小孩没画完 -->
    <path d="M 76 61 C 69 69, 64 78, 60 88 C 53 104, 52 122, 52 143 C 52 158, 55 170, 62 174 C 82 178, 118 178, 139 174 C 147 170, 149 157, 149 143 C 149 117, 146 94, 137 78" fill="none" />
    <!-- 玻璃上的一线反光：只填色，不另起线，保持整张画只有一种墨线 -->
    <path d="M 66 92 C 60 108, 59 130, 63 148 C 66 134, 68 112, 73 96 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="none" />
    <path d="M 138 94 C 142 104, 143 114, 142 124 C 139 116, 137 107, 134 98 Z" fill="#FFFFFF" fill-opacity="0.18" stroke="none" />

    <!-- 罐口的小木塞：略歪，留一道木纹 -->
    <path d="M 78 38 C 77 34, 81 32, 85 32 C 97 30, 112 31, 121 33 C 125 34, 126 38, 125 42 C 124 47, 125 52, 122 55 C 111 58, 89 58, 78 55 C 75 54, 75 50, 76 46 C 77 43, 77 40, 78 38 Z" fill="var(--doodle-yellow, #F9E79F)" fill-opacity="0.72" />
    <path d="M 80 40 C 91 38, 108 38, 121 40" fill="none" stroke-width="2.5" />
    <path d="M 79 47 C 92 45, 107 46, 122 47" fill="none" stroke-width="2.5" />
    <path d="M 81 53 C 93 51, 109 52, 120 53" fill="none" stroke-width="2.5" />

    <!-- 罐口两侧露出的玻璃唇：右边磕了一个小缺口 -->
    <path d="M 67 58 C 70 56, 74 56, 78 57" fill="none" />
    <path d="M 122 57 C 126 55, 129 58, 132 56 C 133 55, 134 57, 136 58" fill="none" />
  </g>
</svg>
