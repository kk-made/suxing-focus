<svg viewBox="0 0 640 200" width="640" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crayon-texture-path">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#crayon-texture-path)" stroke="var(--doodle-stroke, #3A3A3A)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 蜿蜒小路（V5.8.4 恢复最初画法）：两条边线从左下走到右中，路面近大远小的虚线收向远方，
         尽头立一面樱花粉小旗；起点两笔小草。宽图（640×200）经 width 等比渲染于使用指南页头（640rpx 横幅）；
         描边 3.2 为按显示尺寸的校准（形状与最初一致，见 DESIGN.md §9 手绘部件「笔画按显示尺寸加粗」规则） -->
    <!-- 路的上缘 -->
    <path d="M 120 184 C 180 176, 240 170, 296 158 C 352 146, 396 128, 436 108" fill="none" />
    <!-- 路的下缘 -->
    <path d="M 268 188 C 306 178, 344 168, 382 154 C 420 140, 452 122, 480 104" fill="none" />
    <!-- 路面虚线（近大远小；后两笔收深墨绿） -->
    <path d="M 290 160.5 C 308 162, 328 165, 346 167.5" fill="none" />
    <path d="M 398 128 C 412 132, 428 137, 444 141" fill="none" />
    <path d="M 438 106.5 C 450 109, 460 111, 470 112.5" fill="none" />
    <path d="M 362 150 C 370 148.5, 378 146.5, 384 144.5" fill="none" stroke="var(--doodle-pine, #2C4A3B)" />
    <path d="M 408 134.5 C 414 133, 420 131, 426 129" fill="none" stroke="var(--doodle-pine, #2C4A3B)" />
    <!-- 终点小旗（旗杆 + 樱花粉旗面） -->
    <path d="M 484 104 C 483 88, 484.5 72, 483.5 56" fill="none" />
    <path d="M 485 58 C 498 53, 512 55.5, 524 60.5 C 515 69, 504 74.5, 492.5 77.5 C 487.5 72.5, 485.5 64.5, 485 58 Z" fill="var(--doodle-pink, #F5B7B1)" fill-opacity="0.7" stroke="none" />
    <!-- 起点两笔小草 -->
    <path d="M 112 185 C 110.5 179.5, 109.5 175.5, 108 171.5" fill="none" />
    <path d="M 121 185.5 C 122 180.5, 123 177.5, 124 173.5" fill="none" />
  </g>
</svg>
