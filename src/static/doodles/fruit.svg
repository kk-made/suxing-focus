<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crayon-texture-fruit">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#crayon-texture-fruit)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 果柄（深墨绿一笔） -->
    <path
      d="M 50 35 C 50 28, 52 21, 57 15"
      fill="none"
      stroke="var(--doodle-pine, #2C4A3B)"
      stroke-width="5.5"
    />
    <!-- 小叶子：果柄右侧一瓣，纸面填薄荷绿 -->
    <path
      d="M 57 18 C 62 10, 74 9, 80 13 C 76 22, 64 24, 57 18 Z"
      fill="var(--doodle-green, #A2D9CE)"
      fill-opacity="0.9"
      stroke="var(--doodle-pine, #2C4A3B)"
      stroke-width="4.5"
    />
    <!-- 果子本体：顶部微微凹陷、整体歪一点的手绘圆（暖黄，40rpx 下仍可读） -->
    <path
      d="M 50 34 C 38 28, 24 37, 23 53 C 22 70, 34 84, 50 84 C 66 84, 78 70, 77 53 C 76 37, 62 28, 50 34 Z"
      fill="var(--doodle-yellow, #F9E79F)"
      fill-opacity="0.92"
      stroke="var(--doodle-stroke, #3A3A3A)"
      stroke-width="7"
    />
    <!-- 腮红：一笔淡粉蹭上去（不闭合，像蜡笔随手扫的） -->
    <path
      d="M 34 57 C 35 48, 41 43, 48 43"
      fill="none"
      stroke="var(--doodle-pink, #F5B7B1)"
      stroke-width="6"
      opacity="0.9"
    />
  </g>
</svg>
