<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>溯星 · 页面截图</title>
<style>
  :root { --ink:#3a3a3a; --soft:#8a8278; --faint:#b3aaa0; --line:rgba(58,48,38,.10); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(90% 60% at 50% -10%, #fdfcf9 0%, #f4f2ee 55%, #efebe5 100%) fixed;
    color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 48px 32px 80px; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  header { margin-bottom: 34px; }
  .kicker { font-size: 11px; letter-spacing: .32em; color: var(--faint); text-transform: uppercase; }
  h1 { margin: 14px 0 8px; font-size: 24px; font-weight: 500; letter-spacing: .16em; }
  .sub { font-size: 12.5px; color: var(--soft); letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 30px 24px; }
  figure { margin: 0; }
  a { display: block; border-radius: 24px; overflow: hidden; background: #fdfcf9;
      box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 22px 32px -24px rgba(58,48,38,.32), 0 6px 12px -8px rgba(58,48,38,.14); }
  a img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 11px; font-size: 12px; color: var(--faint); letter-spacing: .04em; }
  figcaption b { display: block; color: var(--ink); font-weight: 500; font-size: 12.5px; margin-bottom: 2px; }
  footer { margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--line);
           font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Study Plan · App</div>
    <h1>溯星 · 页面截图</h1>
    <div class="sub">18 张 · 390 × 844（1.5×，585 × 1266 px）· 真实 H5 构建，非设计稿</div>
  </header>

  <div class="grid">
    <figure><a href="./01-splash-quote.png" target="_blank"><img src="./01-splash-quote.png" alt="开场" /></a><figcaption><b>01 启动 · 开场</b>三句话，一句一句落下来</figcaption></figure>
    <figure><a href="./02-splash-writing.png" target="_blank"><img src="./02-splash-writing.png" alt="封面书写中" /></a><figcaption><b>02 启动 · 书写中</b>「溯」已成，「星」正在落笔</figcaption></figure>
    <figure><a href="./03-splash-cover.png" target="_blank"><img src="./03-splash-cover.png" alt="封面完成" /></a><figcaption><b>03 启动 · 完成</b>石到坡顶化成星</figcaption></figure>
    <figure><a href="./04-today.png" target="_blank"><img src="./04-today.png" alt="今日" /></a><figcaption><b>04 今日</b>已完成 / 待完成 / 待复习</figcaption></figure>
    <figure><a href="./05-today-schedule-sheet.png" target="_blank"><img src="./05-today-schedule-sheet.png" alt="安排今日学习" /></a><figcaption><b>05 今日 · 安排</b>自动排期 / 手动挑选</figcaption></figure>
    <figure><a href="./06-focus-running.png" target="_blank"><img src="./06-focus-running.png" alt="专注计时中" /></a><figcaption><b>06 专注 · 计时中</b>圆环随时间闭合</figcaption></figure>
    <figure><a href="./07-focus-paused.png" target="_blank"><img src="./07-focus-paused.png" alt="专注暂停" /></a><figcaption><b>07 专注 · 驻足之后</b>停在哪儿弧就留在哪儿</figcaption></figure>
    <figure><a href="./08-goals.png" target="_blank"><img src="./08-goals.png" alt="目标" /></a><figcaption><b>08 目标</b>进行中 + 已完成「收入囊中」</figcaption></figure>
    <figure><a href="./09-goal-detail.png" target="_blank"><img src="./09-goal-detail.png" alt="目标详情" /></a><figcaption><b>09 目标详情</b>元信息、进度、四个步骤</figcaption></figure>
    <figure><a href="./10-goal-edit.png" target="_blank"><img src="./10-goal-edit.png" alt="编辑目标" /></a><figcaption><b>10 编辑目标</b>手写标题 + 属性胶囊</figcaption></figure>
    <figure><a href="./11-stats.png" target="_blank"><img src="./11-stats.png" alt="统计" /></a><figcaption><b>11 统计</b>近 7 天、本周、连续、累计</figcaption></figure>
    <figure><a href="./12-achievement-book.png" target="_blank"><img src="./12-achievement-book.png" alt="成就收藏集" /></a><figcaption><b>12 成就收藏集</b>左页目录，右页正文</figcaption></figure>
    <figure><a href="./13-mine.png" target="_blank"><img src="./13-mine.png" alt="我的" /></a><figcaption><b>13 我的</b>时长轮盘、学习日、外观</figcaption></figure>
    <figure><a href="./14-guide.png" target="_blank"><img src="./14-guide.png" alt="使用指南" /></a><figcaption><b>14 使用指南</b>全站手势与入口</figcaption></figure>
    <figure><a href="./15-dark-today.png" target="_blank"><img src="./15-dark-today.png" alt="暗色今日" /></a><figcaption><b>15 暗色 · 今日</b>纸变成夜色</figcaption></figure>
    <figure><a href="./16-dark-stats.png" target="_blank"><img src="./16-dark-stats.png" alt="暗色统计" /></a><figcaption><b>16 暗色 · 统计</b>柱与轴线对比可读</figcaption></figure>
    <figure><a href="./17-dark-achievement-book.png" target="_blank"><img src="./17-dark-achievement-book.png" alt="暗色成就册" /></a><figcaption><b>17 暗色 · 成就册</b>深灰书页 + 星星罐</figcaption></figure>
    <figure><a href="./18-dark-mine.png" target="_blank"><img src="./18-dark-mine.png" alt="暗色我的" /></a><figcaption><b>18 暗色 · 我的</b>轮盘相邻值仍可读</figcaption></figure>
  </div>

  <footer>溯星 · 截图取自 dist/build/h5，尺寸 585 × 1266 px（390 × 844 @1.5×）</footer>
</div>
</body>
</html>
